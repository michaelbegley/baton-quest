<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Baton Quest: two-player test</title>
<style>html, body { margin: 0; height: 100%; background: #111; } body { display: flex; } iframe { flex: 1; border: 0; height: 100%; }</style></head>
<body><iframe id="a" src="index.html?view=desk"></iframe><iframe id="b" src="about:blank"></iframe>
<script>
  // A temporary test page for version 123 (removed after the test): the host on the left, a friend on the right, both on screen so both games run.
  window.T = { errs: { a: [], b: [] } };
  function hook(id) { var f = document.getElementById(id); f.addEventListener('load', function () { try { var w = f.contentWindow; w.addEventListener('error', function (e) { T.errs[id].push(String(e.message)); }); w.addEventListener('unhandledrejection', function (e) { T.errs[id].push('rejection ' + String(e.reason)); }); } catch (e) {} }); }
  hook('a'); hook('b');
  T.key = function (id, code, ms) { var w = document.getElementById(id).contentWindow; w.dispatchEvent(new w.KeyboardEvent('keydown', { code: code, key: code, bubbles: true })); setTimeout(function () { w.dispatchEvent(new w.KeyboardEvent('keyup', { code: code, key: code, bubbles: true })); }, ms || 90); };
  T.net = function (id) { var w = document.getElementById(id).contentWindow; return w && w.BQ_NET ? { state: w.BQ_NET.state(), code: w.BQ_NET.code(), link: w.BQ_NET.link() } : null; };
  T.join = function (code) { document.getElementById('b').src = 'index.html?view=desk&join=' + code; };
</script></body></html>
